- hosts: localhost
  connection: local
  vars_files:
    - vars/packages-native.yml
    - vars/packages-aur.yml
    - vars/packages-removed.yml

  tasks:
    - name: 公式リポジトリのパッケージをインストール
      become: true
      community.general.pacman:
        name: "{{ native_packages }}"
        state: present
        update_cache: true

    - name: 明示的に不要と判断したパッケージを削除
      become: true
      community.general.pacman:
        name: "{{ removed_packages }}"
        state: absent
      when: removed_packages | length > 0

    - name: 孤児パッケージを取得
      become: true
      shell: pacman -Qtdq || true
      register: orphans
      changed_when: false

    - name: 孤児パッケージを削除
      become: true
      command: pacman -Rns --noconfirm {{ orphans.stdout_lines | join(' ') }}
      when: orphans.stdout_lines | length > 0

    - name: NetworkManager, bluetooth を有効化して起動
      become: true
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - NetworkManager
        - bluetooth

    - name: sddm を有効化
      become: true
      systemd:
        name: sddm
        enabled: true

    - name: インストール済みパッケージ一覧を取得
      command: pacman -Qq
      register: installed_packages
      changed_when: false

    - name: 不足しているAURパッケージを特定
      set_fact:
        missing_aur_packages: "{{ aur_packages | difference(installed_packages.stdout_lines) }}"

    - name: 不足しているAURパッケージがあれば実行コマンドを提示
      debug:
        msg: |
          以下のAURパッケージが不足しています。手動で実行してください:

          yay -S --needed {{ missing_aur_packages | join(' ') }}
      when: missing_aur_packages | length > 0

    - name: AURパッケージはすべて揃っています
      debug:
        msg: "AURパッケージはすべてインストール済みです。"
      when: missing_aur_packages | length == 0
